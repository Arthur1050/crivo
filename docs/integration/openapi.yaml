        reason:
          type: string
          enum:
            - usage-disabled
            - configuration-changed
            - cadence
            - lease-active
            - superseded
            - contract-unverified
            - invalid-response
            - incomplete-response
            - invalid-volume
            - credential-missing
            - permission-denied
            - rate-limited
            - transport-failed
            - timeout
            - request-obsolete
            - identity-mismatch
            - period-mismatch
            - filters-mismatch
            - overlapping-partitions
            - zero-unverified
        snapshot:
