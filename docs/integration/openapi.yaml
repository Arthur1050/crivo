openapi: 3.1.0
info:
  title: Crivo — Contrato de Integração CRM ↔ Agente
  version: "1.0.0"
  description: >-
    Contrato REST que o fluxo do agente (n8n + WhatsApp, Fase 8) usa para
    entregar leads, atualizar qualificação/status, ingerir mensagens de
    conversa, ler o contexto do tenant e registrar opt-out. Esta especificação
    é a autoridade do contrato (design.md — Approach): qualquer
    reimplementação da API (ex.: microserviço em outro runtime) precisa
    honrá-la, escrevendo no mesmo schema Postgres consumido pelas telas do
    CRM. Veja `guia-integracao.md` para semântica de auth, idempotência,
    transições de status e o procedimento de substituição da implementação.
servers:
  - url: /api/v1
    description: Prefixo de versão do contrato (todos os paths abaixo são relativos a este servidor).
security:
  - bearerAuth: []
tags:
  - name: leads
    description: Entrega e atualização de leads.
  - name: messages
    description: Ingestão de mensagens de conversa.
  - name: context
    description: Leitura de contexto do tenant.
  - name: lgpd
    description: Opt-out de leads (LGPD-01).
  - name: settings
    description: Leitura de persona, modalidade e horário comercial do tenant (INT-09).
  - name: properties
    description: Busca do catálogo de imóveis visíveis (lote-11 — BUSCA-01).
paths:
  /leads:
    post:
      operationId: createLead
      tags: [leads]
      summary: Entrega idempotente de um lead
      description: >-
        Cria o lead com status `em_qualificacao` no tenant da chave. Reentrega
        com o mesmo `externalId` no mesmo tenant devolve o lead existente
        (200), sem duplicar (INT-02).
      parameters:
        - $ref: "#/components/parameters/XCrivoTenant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadCreateRequest"
      responses:
        "201":
          description: Lead criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "200":
          description: Lead já existia para este `externalId` — devolvido sem duplicar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          $ref: "#/components/responses/PayloadInvalido"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "413":
          $ref: "#/components/responses/CorpoGrandeDemais"
      security:
        - bearerAuth: []
        - serviceAuth: []
  /leads/{id}:
    patch:
      operationId: patchLead
      tags: [leads]
      summary: Upsert parcial de qualificação + transição de status
      description: >-
        Chave presente no corpo grava (inclusive `null` explícito limpa a
        coluna); chave ausente não toca a coluna (INT-03). Quando `status`
        está presente, valida a transição contra a máquina de estados e a
        trava humana antes de gravar qualquer campo (INT-04) — veja a tabela
        de transições e os códigos 409 no guia de integração.
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - $ref: "#/components/parameters/XCrivoTenant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadPatchRequest"
      responses:
        "200":
          description: Lead atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          $ref: "#/components/responses/PayloadInvalido"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "404":
          $ref: "#/components/responses/RecursoNaoEncontrado"
        "409":
          description: >-
            Transição inválida, lead travado por ação humana, ou motivo de
            escalonamento ausente — `code` identifica a regra violada. Nenhum
            campo do payload é gravado (atomicidade).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/CorpoGrandeDemais"
      security:
        - bearerAuth: []
        - serviceAuth: []
  /leads/{id}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: Histórico de mensagens do lead
      description: >-
        Retorna as mensagens do lead em ordem cronológica crescente
        (`sentAt` ASC), no mesmo formato de `Message` usado pelo POST
        (CTX-02). Sem `limit`, devolve as 50 mais recentes; com `limit=N`
        (1–100), devolve as N mais recentes — sempre em ordem crescente.
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: >-
            Quantidade máxima de mensagens mais recentes a devolver. Fora da
            faixa 1–100 (incluindo valores não numéricos) responde `400`
            `payload-invalido`.
        - $ref: "#/components/parameters/XCrivoTenant"
      responses:
        "200":
          description: Mensagens do lead em ordem cronológica crescente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/PayloadInvalido"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "404":
          $ref: "#/components/responses/RecursoNaoEncontrado"
      security:
        - bearerAuth: []
        - serviceAuth: []
    post:
      operationId: createMessage
      tags: [messages]
      summary: Ingestão idempotente de mensagem
      description: >-
        Persiste a mensagem na conversa do lead, criando a conversa na
        primeira mensagem. Reentrega com o mesmo `externalId` no mesmo tenant
        devolve a mensagem existente (200), sem duplicar (INT-05). Mensagens
        fora de ordem cronológica são aceitas — a exibição em Chats ordena por
        `sentAt`.
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - $ref: "#/components/parameters/XCrivoTenant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreateRequest"
      responses:
        "201":
          description: Mensagem criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "200":
          description: Mensagem já existia para este `externalId` — devolvida sem duplicar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/PayloadInvalido"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "404":
          $ref: "#/components/responses/RecursoNaoEncontrado"
        "413":
          $ref: "#/components/responses/CorpoGrandeDemais"
      security:
        - bearerAuth: []
        - serviceAuth: []
  /leads/{id}/opt-out:
    post:
      operationId: optOutLead
      tags: [lgpd]
      summary: Registra o opt-out do lead
      description: >-
        Idempotente: repetir a chamada preserva o timestamp original de
        opt-out (LGPD-01). Interromper disparos subsequentes ao lead é dever
        do consumidor (agente) — veja "Opt-out" no guia de integração.
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - $ref: "#/components/parameters/XCrivoTenant"
      responses:
        "200":
          description: Opt-out registrado (ou já existente).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "404":
          $ref: "#/components/responses/RecursoNaoEncontrado"
      security:
        - bearerAuth: []
        - serviceAuth: []
  /context:
    post:
      operationId: queryContext
      tags: [context]
      summary: Corpus documental do tenant para uma pergunta do lead
      description: >-
        Devolve o conteúdo integral de todos os documentos `pronto`, ativos,
        dentro da validade e compatíveis com a modalidade pedida (DOCCTX-01).
        `novo` inclui `novo` e `ambos`; `usado` inclui `usado` e `ambos`;
        `ambos` inclui as três sem duplicar. Documento em `processando`,
        `falha` ou `fora_do_agente`, com tombstone, ou vencido — mesmo antes
        da rotina diária — fica fora do corpus.

        A pergunta viaja no corpo, nunca em query string, porque é dado
        pessoal do lead e em query string acabaria em log de acesso, histórico
        e referer. Ela não filtra nada no lote 12: o modo `direct` entrega o
        corpus inteiro, e perguntas diferentes sobre o mesmo corpus devolvem o
        mesmo conjunto na mesma ordem. O corpus vai do upload mais antigo para
        o mais recente, com o identificador como desempate determinístico.

        O tenant vem exclusivamente da credencial de serviço; nenhum campo do
        corpo o influencia. A resposta declara `Cache-Control: no-store`.
      parameters:
        - $ref: "#/components/parameters/XCrivoTenant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextQuery"
      responses:
        "200":
          description: >-
            Corpus elegível do tenant. Coleção vazia quando nenhum documento
            é elegível — nunca erro, nunca conteúdo de outro tenant.
          headers:
            Cache-Control:
              description: Sempre `no-store` — o corpus nunca fica em cache intermediário.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentContextEnvelope"
        "400":
          $ref: "#/components/responses/PayloadInvalido"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "413":
          $ref: "#/components/responses/CorpoGrandeDemais"
      security:
        - bearerAuth: []
        - serviceAuth: []
    get:
      operationId: getContext
      deprecated: true
      tags: [context]
      summary: "[Descontinuado] Documentos de contexto do tenant, filtrados por modalidade"
      description: >-
        Contrato anterior, mantido apenas como caminho de rollback enquanto o
        workflow publicado migra para `POST /context`. Continua devolvendo o
        shape antigo, com `content` sempre `null`, e será removido.

        Retorna documentos cuja modalidade é a pedida ou `ambos`, excluindo
        expirados mesmo que o job de TTL ainda não tenha rodado (INT-06,
        LGPD-02).
      parameters:
        - name: modality
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ContextModality"
        - $ref: "#/components/parameters/XCrivoTenant"
      responses:
        "200":
          description: Documentos de contexto do tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContextDocument"
        "400":
          $ref: "#/components/responses/PayloadInvalido"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
      security:
        - bearerAuth: []
        - serviceAuth: []
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Persona, modalidade e horário comercial do tenant
      description: >-
        Retorna o nome da imobiliária, a persona do agente (`agentName`,
        `agentPresentationMessage`), a modalidade suportada e o horário
        comercial configurado pela imobiliária em Configurações
        (`meetingDays`, `meetingHoursStart`, `meetingHoursEnd` — CONF-05) do
        tenant da chave. Os 3 campos de horário comercial são `null` quando o
        tenant não configurou — veja `guia-integracao.md` para o fallback
        seg-sex 9h-18h que o consumidor aplica nesse caso.
      parameters:
        - $ref: "#/components/parameters/XCrivoTenant"
      responses:
        "200":
          description: Settings do tenant da chave.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
      security:
        - bearerAuth: []
        - serviceAuth: []
  /properties:
    get:
      operationId: searchProperties
      tags: [properties]
      summary: Busca de imóveis visíveis do catálogo, por critério
      description: >-
        Devolve, no máximo 3 por chamada, os imóveis do tenant que satisfazem
        `status = disponivel` E `published = true` (BUSCA-01/BUSCA-02),
        combinando por conjunção os filtros presentes. `total` conta todos os
        imóveis que casaram com o filtro, mesmo quando maior que o número
        devolvido em `imoveis`. `precoMin`/`precoMax` são recebidos em REAIS
        inteiros; o preço devolvido por imóvel já vem formatado em Real
        brasileiro — centavos nunca atravessam este contrato. A resposta
        nunca inclui logradouro, número, complemento, descrição, foto ou
        qualquer campo do captador (BUSCA-03).
      parameters:
        - name: modalidade
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Modality"
        - name: tipo
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PropertyKind"
        - name: bairro
          in: query
          required: false
          schema:
            type: string
        - name: cidade
          in: query
          required: false
          schema:
            type: string
        - name: precoMin
          in: query
          required: false
          description: Preço mínimo, em reais inteiros (não centavos).
          schema:
            type: integer
            minimum: 1
        - name: precoMax
          in: query
          required: false
          description: Preço máximo, em reais inteiros (não centavos).
          schema:
            type: integer
            minimum: 1
        - name: quartosMin
          in: query
          required: false
          description: Número mínimo de quartos.
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/XCrivoTenant"
      responses:
        "200":
          description: Imóveis visíveis do tenant que casam com o filtro.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertySearchResult"
        "400":
          $ref: "#/components/responses/PayloadInvalido"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
      security:
        - bearerAuth: []
        - serviceAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        API key opaca por tenant (`Authorization: Bearer <chave>`). Identifica
        o tenant — nenhum payload aceita `tenant_id` (INT-01). Chaves
        revogáveis (`revoked_at`). Testado SÓ quando a chave não corresponde
        a uma chave de serviço ativa (`serviceAuth`) — veja "Autenticação e
        revogação" no guia para a regra de precedência entre os dois modos
        (lote-7 — SEC-01).
    serviceAuth:
      type: http
      scheme: bearer
      description: >-
        Credencial de serviço única e cross-tenant (`Authorization: Bearer
        <chave>`), usada pelo fluxo do agente (lote-7 — SEC-01). Exige o
        header adicional `X-Crivo-Tenant` com o slug do tenant — ausente ou
        desconhecido responde `401 tenant-nao-identificado`, nunca cai em
        nenhum tenant default. Verificado ANTES de `bearerAuth`: quando o
        hash da chave corresponde a uma chave de serviço ativa, este modo é
        usado; senão, o servidor cai para `bearerAuth` por tenant. Veja
        "Autenticação e revogação" no guia de integração.
  parameters:
    LeadId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Id do lead no CRM (não o `externalId` do mundo do agente).
    XCrivoTenant:
      name: X-Crivo-Tenant
      in: header
      required: false
      schema:
        type: string
      description: >-
        Slug do tenant (ex.: `triangulo`, `vale-uberaba`). Obrigatório só no
        modo de autenticação de serviço (`serviceAuth`); ignorado no modo por
        chave de tenant (`bearerAuth`), mesmo presente e divergente
        (lote-7 — SEC-01).
  responses:
    NaoAutenticado:
      description: >-
        Sem header de autenticação, chave inválida ou revogada
        (`code: nao-autenticado`); ou, no modo de serviço, `X-Crivo-Tenant`
        ausente ou com slug desconhecido (`code: tenant-nao-identificado`,
        lote-7 — SEC-01). O `code` no corpo distingue as duas causas.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    RecursoNaoEncontrado:
      description: >-
        Recurso inexistente ou pertencente a outro tenant — nunca 403, para
        não revelar a existência do recurso (INT-01 AC3).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadInvalido:
      description: Corpo/parâmetro inválido (JSON malformado, campo obrigatório ausente, enum fora do domínio, data não-ISO).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    CorpoGrandeDemais:
      description: Corpo da requisição excede o limite de 100 KB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ProblemCode:
      type: string
      description: Código estável da regra violada — citado 1:1 no guia de integração.
      enum:
        - nao-autenticado
        - recurso-nao-encontrado
        - payload-invalido
        - transicao-invalida
        - lead-travado-por-humano
        - motivo-escalonamento-obrigatorio
        - corpo-grande-demais
        - rota-inexistente
        - metodo-nao-suportado
        - tenant-nao-identificado
    Problem:
      type: object
      description: application/problem+json (RFC 9457).
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: "URN determinístico por código: `urn:crivo:problem:<code>`."
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          $ref: "#/components/schemas/ProblemCode"
    LeadStatus:
      type: string
      enum: [em_qualificacao, qualificado_agendado, escalado_humano]
    Modality:
      type: string
      enum: [novo, usado, ambos]
    ContextModality:
      type: string
      description: Modalidades válidas para o filtro de contexto — `ambos` não é um filtro válido aqui (é resolvido automaticamente junto de `novo`/`usado`).
      enum: [novo, usado]
    PropertyType:
      type: string
      enum: [casa, apartamento]
    PropertyKind:
      type: string
      description: >-
        Enum própria do catálogo de imóveis (lote-11) — superset de
        `PropertyType` (a enum de qualificação acima, inalterada) nos dois
        valores compartilhados.
      enum:
        - casa
        - apartamento
        - sobrado
        - cobertura
        - terreno
        - sala_comercial
        - chacara
    SerializedProperty:
      type: object
      description: >-
        Um imóvel do catálogo, do jeito que o contrato devolve (BUSCA-03) —
        sem logradouro, número, complemento, descrição, foto ou qualquer
        campo do captador.
      required:
        - referencia
        - tipo
        - modalidade
        - bairro
        - cidade
        - uf
        - preco
        - areaM2
        - quartos
        - banheiros
        - vagas
      properties:
        referencia:
          type: string
        tipo:
          $ref: "#/components/schemas/PropertyKind"
        modalidade:
          $ref: "#/components/schemas/Modality"
        bairro:
          type: string
        cidade:
          type: string
        uf:
          type: string
        preco:
          type: string
          description: >-
            Já formatado em Real brasileiro (ex.: "R$ 450.000,00") — nunca
            centavos crus (bigint não é JSON-safe).
        areaM2:
          type: integer
        quartos:
          type: integer
        banheiros:
          type: integer
        vagas:
          type: integer
    PropertySearchResult:
      type: object
      required: [imoveis, total]
      properties:
        imoveis:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/SerializedProperty"
        total:
          type: integer
          description: >-
            Quantos imóveis casaram com o filtro, mesmo quando maior que o
            número devolvido em `imoveis`.
    Motivation:
      type: string
      enum: [investidor, morador]
    CreditStatus:
      type: string
      enum: [pre_aprovado, recurso_proprio, fgts]
    Sender:
      type: string
      enum: [agente, lead]
    CategoryColor:
      type: string
      enum: [red, orange, yellow, green, teal, cyan, blue, purple, pink, gray]
    LeadCreateRequest:
      type: object
      required: [name, phone, externalId, firstContactAt]
      properties:
        name:
          type: string
        phone:
          type: string
        externalId:
          type: string
          description: "Id do lead no mundo do agente (ex.: wa_id) — chave de idempotência por tenant."
        firstContactAt:
          type: string
          format: date-time
    LeadPatchRequest:
      type: object
      description: >-
        Todos os campos são opcionais; os nullable aceitam `null` explícito
        para limpar a coluna. Chave ausente no JSON nunca é enviada — não
        toca a coluna correspondente.
      properties:
        status:
          $ref: "#/components/schemas/LeadStatus"
        modality:
          type: ["string", "null"]
          enum: [novo, usado, ambos, null]
        region:
          type: ["string", "null"]
        budgetCents:
          type: ["integer", "string", "null"]
          description: Centavos, inteiro ≥ 0 (aceito como number ou string numérica).
        propertyType:
          type: ["string", "null"]
          enum: [casa, apartamento, null]
        purchaseHorizon:
          type: ["string", "null"]
        motivation:
          type: ["string", "null"]
          enum: [investidor, morador, null]
        creditStatus:
          type: ["string", "null"]
          enum: [pre_aprovado, recurso_proprio, fgts, null]
        chainedOperation:
          type: ["boolean", "null"]
        executiveSummary:
          type: ["string", "null"]
        escalationReason:
          type: ["string", "null"]
          description: Obrigatório e não-vazio quando `status` está sendo definido como `escalado_humano`.
        meetingAt:
          type: ["string", "null"]
          format: date-time
    Lead:
      type: object
      description: Representação de um lead na API de integração.
      required:
        - id
        - externalId
        - name
        - phone
        - status
        - modality
        - region
        - budgetCents
        - propertyType
        - purchaseHorizon
        - motivation
        - creditStatus
        - chainedOperation
        - executiveSummary
        - escalationReason
        - meetingAt
        - firstContactAt
        - optedOutAt
      properties:
        id:
          type: string
          format: uuid
        externalId:
          type: ["string", "null"]
        name:
          type: string
        phone:
          type: string
        status:
          $ref: "#/components/schemas/LeadStatus"
        modality:
          type: ["string", "null"]
          enum: [novo, usado, ambos, null]
        region:
          type: ["string", "null"]
        budgetCents:
          type: ["string", "null"]
          description: Centavos, serializado como string (bigint não é JSON-safe).
        propertyType:
          type: ["string", "null"]
          enum: [casa, apartamento, null]
        purchaseHorizon:
          type: ["string", "null"]
        motivation:
          type: ["string", "null"]
          enum: [investidor, morador, null]
        creditStatus:
          type: ["string", "null"]
          enum: [pre_aprovado, recurso_proprio, fgts, null]
        chainedOperation:
          type: ["boolean", "null"]
        executiveSummary:
          type: ["string", "null"]
        escalationReason:
          type: ["string", "null"]
        meetingAt:
          type: ["string", "null"]
          format: date-time
        firstContactAt:
          type: string
          format: date-time
        optedOutAt:
          type: ["string", "null"]
          format: date-time
          description: Presente (não-null) quando o lead deu opt-out (LGPD-01 AC3).
    MessageCreateRequest:
      type: object
      required: [externalId, sender, content, sentAt]
      properties:
        externalId:
          type: string
          description: Id da mensagem no WhatsApp — chave de idempotência por tenant.
        sender:
          $ref: "#/components/schemas/Sender"
        content:
          type: string
        sentAt:
          type: string
          format: date-time
    Message:
      type: object
      required: [id, externalId, sender, content, sentAt]
      properties:
        id:
          type: string
          format: uuid
        externalId:
          type: ["string", "null"]
        sender:
          $ref: "#/components/schemas/Sender"
        content:
          type: string
        sentAt:
          type: string
          format: date-time
    ContextDocumentCategory:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
        color:
          $ref: "#/components/schemas/CategoryColor"
    ContextQuery:
      type: object
      description: >-
        Corpo de `POST /context`. Campo ausente e campo vazio são estados
        distintos e recebem `detail` distinto na recusa 400.
      required: [modality, question]
      properties:
        modality:
          description: >-
            Modalidade da consulta. Diferente de `ContextModality` (o filtro
            do GET descontinuado), aqui `ambos` é um valor pedível.
          $ref: "#/components/schemas/Modality"
        question:
          type: string
          description: >-
            Pergunta real do lead, entre 1 e 4.096 caracteres depois de
            `trim`. Não filtra o corpus no lote 12 e nunca é ecoada na
            resposta nem gravada no registro de recusas.
          minLength: 1
          maxLength: 4096
    DocumentContextEntry:
      type: object
      required: [id, name, modality, category, contentMode, content]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nome do documento, suficiente para o agente atribuir a origem sem misturar os textos.
        modality:
          $ref: "#/components/schemas/Modality"
        category:
          oneOf:
            - $ref: "#/components/schemas/ContextDocumentCategory"
            - type: "null"
        contentMode:
          type: string
          description: Sempre `full` — o lote 12 nunca trunca texto silenciosamente.
          enum: [full]
        content:
          type: string
          description: Texto extraído integral do documento.
    DocumentContextEnvelope:
      type: object
      required: [retrievalMode, documents]
      properties:
        retrievalMode:
          type: string
          description: >-
            Sempre `direct` no lote 12 — o corpus inteiro é injetado. O campo
            existe para que a chegada de recuperação semântica não quebre o
            contrato.
          enum: [direct]
        documents:
          type: array
          description: Corpus ordenado do upload mais antigo para o mais recente.
          items:
            $ref: "#/components/schemas/DocumentContextEntry"
    ContextDocument:
      type: object
      description: "[Descontinuado] Shape do GET legado; substituído por DocumentContextEntry."
      required: [id, name, modality, category, content]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        modality:
          $ref: "#/components/schemas/Modality"
        category:
          oneOf:
            - $ref: "#/components/schemas/ContextDocumentCategory"
            - type: "null"
        content:
          description: Sempre `null` no v1 (mock-first — AD-004); reservado para a Fase 9.
          type: "null"
    SettingsResponse:
      type: object
      description: >-
        Persona, modalidade e horário comercial do tenant (INT-09). Os 3
        campos de horário comercial são `null` quando não configurados na
        tela de Configurações (CONF-05) — o consumidor aplica o fallback
        seg-sex 9h-18h nesse caso (guia-integracao.md).
      required:
        - realEstateName
        - agentName
        - supportedModality
        - agentPresentationMessage
        - agentVoiceTone
        - meetingDays
        - meetingHoursStart
        - meetingHoursEnd
      properties:
        realEstateName:
          type: string
        agentName:
          type: string
        supportedModality:
          $ref: "#/components/schemas/Modality"
        agentPresentationMessage:
          type: ["string", "null"]
        agentVoiceTone:
          description: >-
            Tom de voz e personalidade do agente (lote-6b — PER-03), texto
            livre opcional configurado em Configurações → Persona do Agente
            SDR. `null` quando o tenant não configurou.
          type: ["string", "null"]
        meetingDays:
          description: >-
            Dias de atendimento, ISO 1(segunda)–7(domingo). `null` quando o
            horário comercial não foi configurado.
          type: ["array", "null"]
          items:
            type: integer
            minimum: 1
            maximum: 7
        meetingHoursStart:
          description: >-
            Horário de início do atendimento, formato "HH:MM". `null` quando
            o horário comercial não foi configurado.
          type: ["string", "null"]
        meetingHoursEnd:
          description: >-
            Horário de término do atendimento, formato "HH:MM". `null`
            quando o horário comercial não foi configurado.
          type: ["string", "null"]
