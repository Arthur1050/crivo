components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        API key opaca por tenant (`Authorization: Bearer <chave>`). Identifica
        o tenant — nenhum payload aceita `tenant_id` (INT-01). Chaves
        revogáveis (`revoked_at`). Testado SÓ quando a chave não corresponde
        a uma chave de serviço ativa (`serviceAuth`) — veja "Autenticação e
        revogação" no guia para a regra de precedência entre os dois modos
        (lote-7 — SEC-01).
    serviceAuth:
      type: http
      scheme: bearer
      description: >-
        Credencial de serviço única e cross-tenant (`Authorization: Bearer
        <chave>`), usada pelo fluxo do agente (lote-7 — SEC-01). Exige o
        header adicional `X-Crivo-Tenant` com o slug do tenant — ausente ou
        desconhecido responde `401 tenant-nao-identificado`, nunca cai em
        nenhum tenant default. Verificado ANTES de `bearerAuth`: quando o
        hash da chave corresponde a uma chave de serviço ativa, este modo é
        usado; senão, o servidor cai para `bearerAuth` por tenant. Veja
        "Autenticação e revogação" no guia de integração.
  parameters:
    LeadId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Id do lead no CRM (não o `externalId` do mundo do agente).
    XCrivoTenant:
      name: X-Crivo-Tenant
      in: header
      required: false
      schema:
        type: string
      description: >-
        Slug do tenant (ex.: `triangulo`, `vale-uberaba`). Obrigatório só no
        modo de autenticação de serviço (`serviceAuth`); ignorado no modo por
        chave de tenant (`bearerAuth`), mesmo presente e divergente
        (lote-7 — SEC-01).
  responses:
    NaoAutenticado:
      description: >-
        Sem header de autenticação, chave inválida ou revogada
        (`code: nao-autenticado`); ou, no modo de serviço, `X-Crivo-Tenant`
        ausente ou com slug desconhecido (`code: tenant-nao-identificado`,
        lote-7 — SEC-01). O `code` no corpo distingue as duas causas.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    RecursoNaoEncontrado:
      description: >-
        Recurso inexistente ou pertencente a outro tenant — nunca 403, para
        não revelar a existência do recurso (INT-01 AC3).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadInvalido:
      description: Corpo/parâmetro inválido (JSON malformado, campo obrigatório ausente, enum fora do domínio, data não-ISO).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    CorpoGrandeDemais:
      description: Corpo da requisição excede 100 KiB (102400 bytes UTF-8).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    AgentStateInput:
      type: object
      additionalProperties: false
      required:
        - anchorMessageId
        - resetObservedAt
        - expectedRevision
        - phase
        - askedFields
        - openingHistory
      properties:
        anchorMessageId:
          type: string
          format: uuid
        resetObservedAt:
          type:
            - string
            - "null"
          format: date-time
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        phase:
          type:
            - string
            - "null"
          enum:
            - qualificando
            - agendando
            - encerrada
            - null
        askedFields:
          type: array
          items:
            type: string
            enum:
              - modality
              - region
              - propertyType
              - budgetCents
              - purchaseHorizon
              - motivation
              - creditStatus
              - chainedOperation
          maxItems: 8
        openingHistory:
          type: array
          items:
            type: string
    AgentStateProjection:
      type: object
      additionalProperties: false
      required:
        - tenantId
        - leadId
        - anchorMessageId
        - phase
        - askedFields
        - openingHistory
        - resetObservedAt
        - revision
        - updatedAt
      properties:
        tenantId:
          type: string
          format: uuid
        leadId:
          type: string
          format: uuid
        anchorMessageId:
          type: string
          format: uuid
        phase:
          type:
            - string
            - "null"
          enum:
            - qualificando
            - agendando
            - encerrada
            - null
        askedFields:
          type: array
          items:
            type: string
            enum:
              - modality
              - region
              - propertyType
              - budgetCents
              - purchaseHorizon
              - motivation
              - creditStatus
              - chainedOperation
          maxItems: 8
        openingHistory:
          type: array
          items:
            type: string
        resetObservedAt:
          type:
            - string
            - "null"
          format: date-time
        revision:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    AgentStateResponse:
      type: object
      additionalProperties: false
      required:
