openapi: 3.1.0
info:
  title: Crivo — Contrato de Integração CRM ↔ Agente
  version: "1.0.0"
  description: >-
    Contrato REST que o fluxo do agente (n8n + WhatsApp, Fase 8) usa para
    entregar leads, atualizar qualificação/status, ingerir mensagens de
    conversa, ler o contexto do tenant e registrar opt-out. Esta especificação
    é a autoridade do contrato (design.md — Approach): qualquer
    reimplementação da API (ex.: microserviço em outro runtime) precisa
    honrá-la, escrevendo no mesmo schema Postgres consumido pelas telas do
    CRM. Veja `guia-integracao.md` para semântica de auth, idempotência,
    transições de status e o procedimento de substituição da implementação.
servers:
  - url: /api/v1
    description: Prefixo de versão do contrato (todos os paths abaixo são relativos a este servidor).
security:
  - bearerAuth: []
tags:
  - name: leads
    description: Entrega e atualização de leads.
  - name: messages
    description: Ingestão de mensagens de conversa.
  - name: context
    description: Leitura de contexto do tenant.
  - name: lgpd
    description: Opt-out de leads (LGPD-01).
  - name: settings
    description: Leitura de persona, modalidade e horário comercial do tenant (INT-09).
  - name: properties
    description: Busca do catálogo de imóveis visíveis (lote-11 — BUSCA-01).
  - name: memory-resets
    description: Pedidos de reconstrução da memória do agente feitos pelo CRM (lote-14).
paths:
  /leads:
    post:
      operationId: createLead
      tags: [leads]
      summary: Entrega idempotente de um lead
      description: >-
        Cria o lead com status `em_qualificacao` no tenant da chave. Reentrega
        com o mesmo `externalId` no mesmo tenant devolve o lead existente
        (200), sem duplicar (INT-02). O campo opcional `whatsappPhoneNumberId`
        ensina ao CRM o número de WhatsApp da imobiliária para o qual o lead
        escreveu (lote-14): grava quando o valor muda e nunca é apagado por
        uma entrega que não o envia.
      parameters:
        - $ref: "#/components/parameters/XCrivoTenant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadCreateRequest"
      responses:
        "201":
          description: Lead criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "200":
          description: Lead já existia para este `externalId` — devolvido sem duplicar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          $ref: "#/components/responses/PayloadInvalido"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "413":
          $ref: "#/components/responses/CorpoGrandeDemais"
      security:
        - bearerAuth: []
        - serviceAuth: []
  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Leitura de um lead, com a condução humana
      description: >-
        Devolve o lead do tenant da credencial (lote-14). O agente lê antes de
        cada envio para conferir `humanTakeoverAt`: com a marca preenchida, um
        humano conduz a conversa pelo CRM e o agente não envia. Lead de outro
        tenant ou inexistente responde `404`.
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - $ref: "#/components/parameters/XCrivoTenant"
      responses:
        "200":
          description: Lead do tenant da chave.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "404":
          $ref: "#/components/responses/RecursoNaoEncontrado"
      security:
        - bearerAuth: []
        - serviceAuth: []
    patch:
      operationId: patchLead
      tags: [leads]
      summary: Upsert parcial de qualificação + transição de status
      description: >-
        Chave presente no corpo grava (inclusive `null` explícito limpa a
        coluna); chave ausente não toca a coluna (INT-03). Quando `status`
        está presente, valida a transição contra a máquina de estados e a
        trava humana antes de gravar qualquer campo (INT-04) — veja a tabela
        de transições e os códigos 409 no guia de integração. Quando o lead
        tem a marca de condução humana (`humanTakeoverAt`), um patch com
        `status` ou `meetingAt` responde `409 lead-conduzido-por-humano` sem
        gravar nada (lote-14); patch só de qualificação segue aceito.
        Agendar (`meetingAt`) ou escalar atribui um responsável, devolvido em
        `assignedBroker` (lote-8).
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - $ref: "#/components/parameters/XCrivoTenant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadPatchRequest"
      responses:
        "200":
          description: >-
            Lead atualizado. `assignedBroker` aparece só quando esta operação
            atribuiu um responsável (agendamento ou escalonamento).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadPatchResponse"
        "400":
          $ref: "#/components/responses/PayloadInvalido"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "404":
          $ref: "#/components/responses/RecursoNaoEncontrado"
        "409":
          description: >-
            Transição inválida (`transicao-invalida`), lead travado por ação
            humana (`lead-travado-por-humano`), motivo de escalonamento ausente
            (`motivo-escalonamento-obrigatorio`), lead conduzido por um humano
            (`lead-conduzido-por-humano`), nenhum corretor disponível no
            horário (`sem-corretor-disponivel`) ou conflito de agenda
            (`conflito-de-agenda`) — `code` identifica a regra violada. Nenhum
            campo do payload é gravado (atomicidade).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/CorpoGrandeDemais"
      security:
        - bearerAuth: []
        - serviceAuth: []
  /leads/{id}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: Histórico de mensagens do lead
      description: >-
        Retorna as mensagens do lead em ordem cronológica crescente
        (`sentAt` ASC), no mesmo formato de `Message` usado pelo POST
        (CTX-02). Sem `limit`, devolve as 50 mais recentes; com `limit=N`
        (1–100), devolve as N mais recentes — sempre em ordem crescente.
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: >-
            Quantidade máxima de mensagens mais recentes a devolver. Fora da
            faixa 1–100 (incluindo valores não numéricos) responde `400`
            `payload-invalido`.
        - $ref: "#/components/parameters/XCrivoTenant"
      responses:
        "200":
          description: Mensagens do lead em ordem cronológica crescente.
          headers:
            X-Crivo-Anchor-Message-Id:
              description: ID do inbound cronologicamente corrente (sentAt/id), independente do limit; string null sem inbound.
              schema:
                type: string
            X-Crivo-Agent-State-Revision:
              description: Revisão corrente da projeção do agente; string null sem projeção. Mesmo snapshot do histórico, inclusive array vazio.
              schema:
                type: string
                pattern: '^(null|[0-9]+)$'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/PayloadInvalido"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "404":
          $ref: "#/components/responses/RecursoNaoEncontrado"
      security:
        - bearerAuth: []
        - serviceAuth: []
    post:
      operationId: createMessage
      tags: [messages]
      summary: Ingestão idempotente de mensagem
      description: >-
        Persiste a mensagem na conversa do lead, criando a conversa na
        primeira mensagem. Reentrega com o mesmo `externalId` no mesmo tenant
        devolve a mensagem existente (200), sem duplicar (INT-05). Mensagens
        fora de ordem cronológica são aceitas — a exibição em Chats ordena por
        `sentAt`. Só `agente` e `lead` são aceitos em `sender`: `humano` é
        autoria do CRM (envio pela tela de Chats) e responde `400
        payload-invalido`, sem gravar.
        Canal ausente/nulo mantém legado sem inferência. Canal novo presente
        exige vínculo e propriedade verificada no tenant, sem credencial de
        transporte; caso contrário 409 canal-nao-vinculado. Replay conserva
        todos os fatos originais, inclusive canal, e retorna metadata atual.
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - $ref: "#/components/parameters/XCrivoTenant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreateRequest"
      responses:
        "201":
          description: Mensagem criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageIngestResponse"
        "200":
          description: Mensagem já existia para este `externalId` — devolvida sem duplicar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageIngestResponse"
        "400":
          $ref: "#/components/responses/PayloadInvalido"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "404":
          $ref: "#/components/responses/RecursoNaoEncontrado"
        "413":
          $ref: "#/components/responses/CorpoGrandeDemais"
        "409":
          description: Número novo não vinculado e verificado neste tenant (canal-nao-vinculado).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
        - bearerAuth: []
        - serviceAuth: []
  /leads/{id}/opt-out:
    post:
      operationId: optOutLead
      tags: [lgpd]
      summary: Registra o opt-out do lead
      description: >-
        Idempotente: repetir a chamada preserva o timestamp original de
        opt-out (LGPD-01). Interromper disparos subsequentes ao lead é dever
        do consumidor (agente) — veja "Opt-out" no guia de integração.
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - $ref: "#/components/parameters/XCrivoTenant"
      responses:
        "200":
          description: Opt-out registrado (ou já existente).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "404":
          $ref: "#/components/responses/RecursoNaoEncontrado"
      security:
        - bearerAuth: []
        - serviceAuth: []
  /memory-resets:
    get:
      operationId: listMemoryResets
      tags: [memory-resets]
      summary: Pedidos de reconstrução da memória do agente
      description: >-
        Lista os leads do tenant da credencial cujo `memory_reset_requested_at`
        é maior ou igual a `since` (lote-14): devolução da conversa ao agente e
        opt-out registrado pelo CRM. A fronteira é inclusiva. Lead sem
        `externalId` não tem sessão no agente e fica de fora. O agente purga a
        memória da sessão `waId` e reconstrói a partir do histórico do CRM.
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: >-
            Instante inicial, ISO-8601 com fuso. Ausente, vazio ou inválido
            responde `400` `payload-invalido`.
        - $ref: "#/components/parameters/XCrivoTenant"
      responses:
        "200":
          description: Pedidos do tenant a partir de `since`, em ordem crescente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryResetList"
        "400":
          $ref: "#/components/responses/PayloadInvalido"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
      security:
        - bearerAuth: []
        - serviceAuth: []
  /context:
    post:
      operationId: queryContext
      tags: [context]
      summary: Corpus documental do tenant para uma pergunta do lead
      description: >-
        Devolve o conteúdo integral de todos os documentos `pronto`, ativos,
        dentro da validade e compatíveis com a modalidade pedida (DOCCTX-01).
        `novo` inclui `novo` e `ambos`; `usado` inclui `usado` e `ambos`;
        `ambos` inclui as três sem duplicar. Documento em `processando`,
        `falha` ou `fora_do_agente`, com tombstone, ou vencido — mesmo antes
        da rotina diária — fica fora do corpus.

        A pergunta viaja no corpo, nunca em query string, porque é dado
        pessoal do lead e em query string acabaria em log de acesso, histórico
        e referer. Ela não filtra nada no lote 12: o modo `direct` entrega o
        corpus inteiro, e perguntas diferentes sobre o mesmo corpus devolvem o
        mesmo conjunto na mesma ordem. O corpus vai do upload mais antigo para
        o mais recente, com o identificador como desempate determinístico.

        O tenant vem exclusivamente da credencial de serviço; nenhum campo do
        corpo o influencia. A resposta declara `Cache-Control: no-store`.
      parameters:
        - $ref: "#/components/parameters/XCrivoTenant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextQuery"
      responses:
        "200":
          description: >-
            Corpus elegível do tenant. Coleção vazia quando nenhum documento
            é elegível — nunca erro, nunca conteúdo de outro tenant.
          headers:
            Cache-Control:
              description: Sempre `no-store` — o corpus nunca fica em cache intermediário.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentContextEnvelope"
        "400":
          $ref: "#/components/responses/PayloadInvalido"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "413":
          $ref: "#/components/responses/CorpoGrandeDemais"
        "503":
          description: servico-indisponivel — leitura documental temporariamente indisponível.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
        - bearerAuth: []
        - serviceAuth: []
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Persona, modalidade e horário comercial do tenant
      description: >-
        Retorna o nome da imobiliária, a persona do agente (`agentName`,
        `agentPresentationMessage`), a modalidade suportada e o horário
        comercial configurado pela imobiliária em Configurações
        (`meetingDays`, `meetingHoursStart`, `meetingHoursEnd` — CONF-05) do
        tenant da chave. Os 3 campos de horário comercial são `null` quando o
        tenant não configurou — veja `guia-integracao.md` para o fallback
        seg-sex 9h-18h que o consumidor aplica nesse caso.
      parameters:
        - $ref: "#/components/parameters/XCrivoTenant"
      responses:
        "200":
          description: Settings do tenant da chave.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
      security:
        - bearerAuth: []
        - serviceAuth: []
  /properties:
    get:
      operationId: searchProperties
      tags: [properties]
      summary: Busca de imóveis visíveis do catálogo, por critério
      description: >-
        Devolve, no máximo 3 por chamada, os imóveis do tenant que satisfazem
        `status = disponivel` E `published = true` (BUSCA-01/BUSCA-02),
        combinando por conjunção os filtros presentes. `total` conta todos os
        imóveis que casaram com o filtro, mesmo quando maior que o número
        devolvido em `imoveis`. `precoMin`/`precoMax` são recebidos em REAIS
        inteiros; o preço devolvido por imóvel já vem formatado em Real
        brasileiro — centavos nunca atravessam este contrato. A resposta
        nunca inclui logradouro, número, complemento, descrição, foto ou
        qualquer campo do captador (BUSCA-03).
      parameters:
        - name: modalidade
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Modality"
        - name: tipo
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PropertyKind"
        - name: bairro
          in: query
          required: false
          schema:
            type: string
        - name: cidade
          in: query
          required: false
          schema:
            type: string
        - name: precoMin
          in: query
          required: false
          description: Preço mínimo, em reais inteiros (não centavos).
          schema:
            type: integer
            minimum: 1
        - name: precoMax
          in: query
          required: false
          description: Preço máximo, em reais inteiros (não centavos).
          schema:
            type: integer
            minimum: 1
        - name: quartosMin
          in: query
          required: false
          description: Número mínimo de quartos.
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/XCrivoTenant"
      responses:
        "200":
          description: Imóveis visíveis do tenant que casam com o filtro.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertySearchResult"
        "400":
          $ref: "#/components/responses/PayloadInvalido"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
      security:
        - bearerAuth: []
        - serviceAuth: []
  /leads/{id}/agent-state:
    post:
      operationId: publishAgentState
      tags:
        - whatsapp
      summary: Publica projeção versionada calculada para a âncora/reset originais
      description: >-
        Publica projeção versionada calculada para a âncora/reset originais. Revisão 0 cria 1; replay idêntico
        preserva fatos. Não reabre fase encerrada na mesma âncora/reset. A metadata de POST /messages é corrente
        e não autoriza publicar saída calculada em âncora anterior.
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - $ref: "#/components/parameters/XCrivoTenant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentStateInput"
      x-max-body-bytes: 102400
      responses:
        "200":
          description: Resultado factual/idempotente; ver semântica da operação.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStateResponse"
        "400":
          description: payload-invalido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: nao-autenticado ou tenant-nao-identificado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "recurso-nao-encontrado: lead ausente/UUID inválido/outro tenant."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          description: metodo-nao-suportado; Allow anuncia somente o verbo suportado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "contexto-alterado ou transicao-invalida: âncora/reset/revisão/fase divergente."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: "corpo-grande-demais: mais de 100 KiB UTF-8."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
        - bearerAuth: []
        - serviceAuth: []
  /whatsapp/automation/candidates:
    get:
      operationId: listAutomationCandidates
      tags:
        - whatsapp
      summary: Página de candidatos examinados no corte estável do servidor
      description: >-
        Página de candidatos examinados no corte estável do servidor. Cursor opaco vinculado ao tenant/corte;
        pode haver página vazia com nextCursor. Não é snapshot MVCC. Consulta não reivindica nem autoriza envio.
      parameters:
        - $ref: "#/components/parameters/XCrivoTenant"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 1024
      responses:
        "200":
          description: Resultado factual/idempotente; ver semântica da operação.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidatePage"
        "400":
          description: payload-invalido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: nao-autenticado ou tenant-nao-identificado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "recurso-nao-encontrado: tenant ausente."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          description: metodo-nao-suportado; Allow anuncia somente o verbo suportado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
        - bearerAuth: []
        - serviceAuth: []
  /leads/{id}/reengagement/prepare:
    post:
      operationId: prepareReengagement
      tags:
        - reengagement
      summary: Reserva lease própria e lê frame factual antes da geração
      description: >-
        Reserva lease própria e lê frame factual antes da geração. Novo claim retorna 201 com
        claimToken/expiração/frame; 200 de episódio consumido não devolve token alheio. Falha de leitura libera
        só o claim novo e nunca desfaz dispatch autorizado.
      parameters:
        - $ref: "#/components/parameters/LeadId"
        - $ref: "#/components/parameters/XCrivoTenant"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnchorInput"
      x-max-body-bytes: 102400
      responses:
        "200":
          description: Resultado factual/idempotente; ver semântica da operação.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumedEpisode"
        "201":
          description: Claim novo reservado; frame transitório não é autorização Meta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparedEpisode"
        "400":
          description: payload-invalido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: nao-autenticado ou tenant-nao-identificado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: recurso-nao-encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          description: metodo-nao-suportado; Allow anuncia somente o verbo suportado.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >-
            contexto-alterado, transicao-invalida, claim-expirada, episodio-consumido ou
            estado-agente-desconhecido conforme a guarda do servidor. episodio-em-preparacao quando lease ativa.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: "corpo-grande-demais: mais de 100 KiB UTF-8."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "estado-agente-desconhecido: leitura técnica indisponível."
          content:
            application/problem+json:
              schema:
