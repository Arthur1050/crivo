    ProblemCode:
      type: string
      description: Código estável da regra violada — citado 1:1 no guia de integração.
      enum:
        - nao-autenticado
        - recurso-nao-encontrado
        - payload-invalido
        - transicao-invalida
        - lead-travado-por-humano
        - motivo-escalonamento-obrigatorio
        - corpo-grande-demais
        - rota-inexistente
        - metodo-nao-suportado
        - tenant-nao-identificado
        - sem-corretor-disponivel
        - conflito-de-agenda
        - lead-conduzido-por-humano
        - canal-nao-vinculado
        - contexto-alterado
        - episodio-em-preparacao
        - claim-expirada
        - episodio-consumido
        - estado-agente-desconhecido
        - servico-indisponivel
    Problem:
      type: object
      description: application/problem+json (RFC 9457).
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: "URN determinístico por código: `urn:crivo:problem:<code>`."
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          $ref: "#/components/schemas/ProblemCode"
    LeadStatus:
      type: string
      enum: [em_qualificacao, qualificado_agendado, escalado_humano]
    Modality:
      type: string
      enum: [novo, usado, ambos]
    PropertyType:
      type: string
      enum: [casa, apartamento]
    PropertyKind:
      type: string
      description: >-
        Enum própria do catálogo de imóveis (lote-11) — superset de
        `PropertyType` (a enum de qualificação acima, inalterada) nos dois
        valores compartilhados.
      enum:
        - casa
        - apartamento
        - sobrado
        - cobertura
        - terreno
        - sala_comercial
        - chacara
    SerializedProperty:
      type: object
      description: >-
        Um imóvel do catálogo, do jeito que o contrato devolve (BUSCA-03) —
        sem logradouro, número, complemento, descrição, foto ou qualquer
        campo do captador.
      required:
        - referencia
        - tipo
        - modalidade
        - bairro
        - cidade
        - uf
        - preco
        - areaM2
        - quartos
        - banheiros
        - vagas
      properties:
        referencia:
          type: string
        tipo:
          $ref: "#/components/schemas/PropertyKind"
        modalidade:
          $ref: "#/components/schemas/Modality"
        bairro:
          type: string
        cidade:
          type: string
        uf:
          type: string
        preco:
          type: string
          description: >-
            Já formatado em Real brasileiro (ex.: "R$ 450.000,00") — nunca
            centavos crus (bigint não é JSON-safe).
        areaM2:
          type: integer
        quartos:
          type: integer
        banheiros:
          type: integer
        vagas:
          type: integer
    PropertySearchResult:
      type: object
      required: [imoveis, total]
      properties:
        imoveis:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/SerializedProperty"
        total:
          type: integer
          description: >-
            Quantos imóveis casaram com o filtro, mesmo quando maior que o
            número devolvido em `imoveis`.
    Motivation:
      type: string
      enum: [investidor, morador]
    CreditStatus:
      type: string
      enum: [pre_aprovado, recurso_proprio, fgts]
    Sender:
      type: string
      description: >-
        Autor da mensagem. `humano` é só leitura: aparece em `GET
        /leads/{id}/messages` (fala de um corretor pelo CRM), mas é recusado em
        `POST /leads/{id}/messages` (`400 payload-invalido`).
      enum: [agente, lead, humano]
    AgentWritableSender:
      type: string
      description: Autores que o agente pode gravar em `POST /leads/{id}/messages`.
      enum: [agente, lead]
    CategoryColor:
      type: string
      enum: [red, orange, yellow, green, teal, cyan, blue, purple, pink, gray]
    LeadCreateRequest:
      type: object
      required: [name, phone, externalId, firstContactAt]
      properties:
        name:
          type: string
        phone:
          type: string
        externalId:
          type: string
          description: "Id do lead no mundo do agente (ex.: wa_id) — chave de idempotência por tenant."
        firstContactAt:
          type: string
          format: date-time
        whatsappPhoneNumberId:
          type: string
          pattern: "^[0-9]{1,32}$"
          description: >-
            Opcional (lote-14). Id do número de WhatsApp da imobiliária para o
            qual o lead escreveu (só dígitos, 1 a 32). Gravado quando muda;
            ausente nunca apaga o valor existente. Vazio ou não numérico
            responde `400` `payload-invalido`.
    LeadPatchRequest:
      type: object
      description: >-
        Todos os campos são opcionais; os nullable aceitam `null` explícito
        para limpar a coluna. Chave ausente no JSON nunca é enviada — não
        toca a coluna correspondente.
      properties:
        status:
          $ref: "#/components/schemas/LeadStatus"
        modality:
          type: ["string", "null"]
          enum: [novo, usado, ambos, null]
        region:
          type: ["string", "null"]
        budgetCents:
          type: ["integer", "string", "null"]
          description: Centavos, inteiro ≥ 0 (aceito como number ou string numérica).
        propertyType:
          type: ["string", "null"]
          enum: [casa, apartamento, null]
        purchaseHorizon:
          type: ["string", "null"]
        motivation:
          type: ["string", "null"]
          enum: [investidor, morador, null]
        creditStatus:
          type: ["string", "null"]
          enum: [pre_aprovado, recurso_proprio, fgts, null]
        chainedOperation:
          type: ["boolean", "null"]
        executiveSummary:
          type: ["string", "null"]
        escalationReason:
          type: ["string", "null"]
          description: Obrigatório e não-vazio quando `status` está sendo definido como `escalado_humano`.
        meetingAt:
          type: ["string", "null"]
          format: date-time
    Lead:
      type: object
      description: Representação de um lead na API de integração.
      required:
        - id
        - externalId
        - name
        - phone
        - status
        - modality
        - region
        - budgetCents
        - propertyType
        - purchaseHorizon
        - motivation
        - creditStatus
        - chainedOperation
        - executiveSummary
        - escalationReason
        - meetingAt
        - firstContactAt
        - optedOutAt
        - humanTakeoverAt
        - memoryResetRequestedAt
      properties:
        id:
          type: string
          format: uuid
        externalId:
          type: ["string", "null"]
        name:
          type: string
        phone:
          type: string
        status:
          $ref: "#/components/schemas/LeadStatus"
        modality:
          type: ["string", "null"]
          enum: [novo, usado, ambos, null]
        region:
          type: ["string", "null"]
        budgetCents:
          type: ["string", "null"]
          description: Centavos, serializado como string (bigint não é JSON-safe).
        propertyType:
          type: ["string", "null"]
          enum: [casa, apartamento, null]
        purchaseHorizon:
          type: ["string", "null"]
        motivation:
          type: ["string", "null"]
          enum: [investidor, morador, null]
        creditStatus:
          type: ["string", "null"]
          enum: [pre_aprovado, recurso_proprio, fgts, null]
        chainedOperation:
          type: ["boolean", "null"]
        executiveSummary:
          type: ["string", "null"]
        escalationReason:
          type: ["string", "null"]
        meetingAt:
          type: ["string", "null"]
          format: date-time
        firstContactAt:
          type: string
          format: date-time
        optedOutAt:
          type: ["string", "null"]
          format: date-time
          description: Presente (não-null) quando o lead deu opt-out (LGPD-01 AC3).
        humanTakeoverAt:
          type: ["string", "null"]
          format: date-time
          description: >-
            Marca de condução humana (lote-14). Não-null quando um humano
            assumiu a conversa pelo CRM: o agente não envia ao lead enquanto
            ela estiver preenchida, e `PATCH` com `status` ou `meetingAt`
            responde `409 lead-conduzido-por-humano`.
        memoryResetRequestedAt:
          type: ["string", "null"]
          format: date-time
          description: >-
            Instante em que o CRM pediu a reconstrução da memória do agente
            (devolução ao agente ou opt-out pelo CRM); `null` quando não há
            pedido. Também listado em `GET /memory-resets`.
    AssignedBroker:
      type: object
      description: Corretor escolhido pelo CRM na operação (nunca a lista de candidatos).
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
    LeadPatchResponse:
      description: >-
        `Lead` atualizado, mais `assignedBroker` quando esta operação atribuiu
        um responsável (agendamento ou escalonamento, lote-8).
      allOf:
        - $ref: "#/components/schemas/Lead"
        - type: object
          properties:
            assignedBroker:
              $ref: "#/components/schemas/AssignedBroker"
    MemoryReset:
      type: object
      required: [leadId, waId, requestedAt]
      properties:
        leadId:
          type: string
          format: uuid
        waId:
          type: string
          description: "`externalId` do lead (wa_id) — compõe a chave da sessão de memória no agente."
        requestedAt:
          type: string
          format: date-time
    MemoryResetList:
      type: object
      required: [resets]
      properties:
        resets:
          type: array
          items:
            $ref: "#/components/schemas/MemoryReset"
    MessageCreateRequest:
      type: object
      required: [externalId, sender, content, sentAt]
      properties:
        externalId:
          type: string
          description: Id da mensagem no WhatsApp — chave de idempotência por tenant.
        sender:
          $ref: "#/components/schemas/AgentWritableSender"
        content:
          type: string
        sentAt:
          type: string
          format: date-time
        whatsappPhoneNumberId:
          type: ["string", "null"]
          pattern: '^\s*[0-9]{1,32}\s*$'
          description: ID factual do número no evento/envio; opcional ou nulo para legado, sem inferência do cadastro do lead. String recebe trim antes da validação.
    Message:
      type: object
      required: [id, externalId, sender, content, sentAt, authorName, whatsappPhoneNumberId]
      properties:
        id:
          type: string
          format: uuid
        externalId:
          type: ["string", "null"]
        sender:
          $ref: "#/components/schemas/Sender"
        content:
          type: string
        sentAt:
          type: string
          format: date-time
        authorName:
          type: ["string", "null"]
          description: >-
            Nome de quem escreveu, só quando `sender` é `humano` (lote-14); `null`
            nas demais.
        whatsappPhoneNumberId:
          type: ["string", "null"]
          description: Canal factual original da mensagem; null no legado, nunca enriquecido no replay.
    MessageIngestResponse:
      allOf:
        - $ref: "#/components/schemas/Message"
        - type: object
          required: [anchorMessageId, agentStateRevision]
          properties:
            anchorMessageId:
              type: ["string", "null"]
              format: uuid
              description: ID do inbound corrente por sentAt/id, mesmo ao ingerir saída, mensagem atrasada ou replay; null sem inbound.
            agentStateRevision:
              type: ["integer", "null"]
              minimum: 1
              description: Revisão corrente da projeção do agente, independente da revisão da ponte; null sem projeção.
    ContextDocumentCategory:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
        color:
          $ref: "#/components/schemas/CategoryColor"
    ContextQuery:
      type: object
      description: >-
        Corpo de `POST /context`. Campo ausente e campo vazio são estados
        distintos e recebem `detail` distinto na recusa 400.
      required: [modality, question]
      properties:
        modality:
          description: >-
            Modalidade da consulta. `ambos` é um valor pedível e devolve o
            corpus das duas modalidades.
          $ref: "#/components/schemas/Modality"
        question:
          type: string
          description: >-
            Pergunta real do lead, entre 1 e 4.096 caracteres depois de
            `trim`. Não filtra o corpus no lote 12 e nunca é ecoada na
            resposta nem gravada no registro de recusas.
          minLength: 1
          maxLength: 4096
        reservedContextBytes:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Reserva interna proativa em bytes UTF-8 antes dos documentos. Opcional; o CRM desconta do teto publicado do tenant/modalidade e recusa 400 se o envelope inteiro não cabe. Ausência mantém comportamento normal; nunca amplia teto nem trunca documento.
    DocumentContextEntry:
      type: object
      required: [id, name, modality, category, contentMode, content]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nome do documento, suficiente para o agente atribuir a origem sem misturar os textos.
        modality:
          $ref: "#/components/schemas/Modality"
        category:
          oneOf:
            - $ref: "#/components/schemas/ContextDocumentCategory"
            - type: "null"
        contentMode:
          type: string
          description: Sempre `full` — o lote 12 nunca trunca texto silenciosamente.
          enum: [full]
        content:
          type: string
          description: Texto extraído integral do documento.
    DocumentContextEnvelope:
      type: object
      required: [retrievalMode, documents]
      properties:
        retrievalMode:
          type: string
          description: >-
            Sempre `direct` no lote 12 — o corpus inteiro é injetado. O campo
            existe para que a chegada de recuperação semântica não quebre o
            contrato.
          enum: [direct]
        documents:
          type: array
          description: Corpus ordenado do upload mais antigo para o mais recente.
          items:
            $ref: "#/components/schemas/DocumentContextEntry"
    SettingsResponse:
      type: object
      description: >-
        Persona, modalidade e horário comercial do tenant (INT-09). Os 3
        campos de horário comercial são `null` quando não configurados na
        tela de Configurações (CONF-05) — o consumidor aplica o fallback
        seg-sex 9h-18h nesse caso (guia-integracao.md).
      required:
        - realEstateName
        - agentName
        - supportedModality
        - agentPresentationMessage
        - agentVoiceTone
        - meetingDays
        - meetingHoursStart
        - meetingHoursEnd
      properties:
        realEstateName:
          type: string
        agentName:
          type: string
        supportedModality:
          $ref: "#/components/schemas/Modality"
        agentPresentationMessage:
          type: ["string", "null"]
        agentVoiceTone:
          description: >-
            Tom de voz e personalidade do agente (lote-6b — PER-03), texto
            livre opcional configurado em Configurações → Persona do Agente
            SDR. `null` quando o tenant não configurou.
          type: ["string", "null"]
        meetingDays:
          description: >-
            Dias de atendimento, ISO 1(segunda)–7(domingo). `null` quando o
            horário comercial não foi configurado.
          type: ["array", "null"]
          items:
            type: integer
            minimum: 1
            maximum: 7
        meetingHoursStart:
          description: >-
            Horário de início do atendimento, formato "HH:MM". `null` quando
            o horário comercial não foi configurado.
          type: ["string", "null"]
        meetingHoursEnd:
          description: >-
            Horário de término do atendimento, formato "HH:MM". `null`
            quando o horário comercial não foi configurado.
          type: ["string", "null"]
